@if (tiles().length) {
  <div class="masonry">
    @for (column of columns(); track $index) {
      <div class="masonry__col">
        @for (item of column; track item.tile.id) {
          <button type="button" class="tile" (click)="setIndex(item.index)" [attr.aria-label]="'Ampliar fotografía ' + (item.index + 1) + ' de ' + total()">
            <app-photo
              [media]="item.tile"
              [ratio]="item.tile.ratio"
              [alt]="item.tile.alt ?? title()"
              sizes="(max-width: 600px) 100vw, (max-width: 1000px) 50vw, 33vw"
              [maxWidth]="900"
            />
          </button>
        }
      </div>
    }
  </div>
}

@if (loading()) {
  <app-skeleton-gallery [count]="tiles().length ? 3 : 9" />
}

<span #sentinel class="sentinel" aria-hidden="true"></span>

@if (openIndex() !== null) {
  <app-lightbox
    [items]="tiles()"
    [index]="openIndex()!"
    [total]="total()"
    (indexChange)="setIndex($event)"
    (closed)="openIndex.set(null)"
  />
}
