@if (ready()) {
  @if (config().garland; as garland) {
    <div class="garland" [class]="'garland garland--' + garland">
      <svg class="garland__string" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0Q50 200 100 0" /></svg>
      @for (flag of flags(); track $index) {
        <span class="hang" [style.--t]="flag.t">
          <span class="flag" [class]="'flag flag--' + flag.tone" [style.animation-delay.s]="-$index * 0.35"></span>
        </span>
      }
    </div>
  }
  @if (decoration() === 'fireworks') {
    <app-fireworks palette="new-year" />
  } @else if (decoration() === 'fireworks_feria') {
    <app-fireworks palette="feria" />
  }
  @for (p of particles(); track $index) {
    <span
      class="particle"
      [class]="'particle tone-' + p.tone"
      [class.particle--rise]="config().rise"
      [style.left.%]="p.left"
      [style.--size]="p.size"
      [style.--drift]="p.drift + 'px'"
      [style.--spin]="p.spin + 'deg'"
      [style.--dur]="p.duration + 's'"
      [style.--delay]="p.delay + 's'"
    ></span>
  }
}
