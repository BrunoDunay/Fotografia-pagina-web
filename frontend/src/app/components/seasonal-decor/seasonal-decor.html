@if (ready()) {
  @if (config().garland; as garland) {
    <div class="garland" [class]="'garland garland--' + garland">
      @for (tone of flags(); track $index) {
        <span class="flag" [class]="'flag flag--' + tone" [style.animation-delay.s]="-$index * 0.35"></span>
      }
    </div>
  }
  @for (p of particles(); track $index) {
    <span
      class="particle"
      [class]="'particle tone-' + p.tone"
      [class.particle--rise]="config().rise"
      [style.left.%]="p.left"
      [style.--size]="p.size"
      [style.--drift]="p.drift + 'px'"
      [style.--spin]="p.spin + 'deg'"
      [style.--dur]="p.duration + 's'"
      [style.--delay]="p.delay + 's'"
    ></span>
  }
}
